---
deployment:
  tasks:
    - export DEPLOYPATH=/home/mabq7713/public_html/
    - /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp -R public $DEPLOYPATH
    - /bin/cp -R system $DEPLOYPATH
    - /bin/cp -R vendor $DEPLOYPATH
    - /bin/cp index.php $DEPLOYPATH
    - /bin/cp spark $DEPLOYPATH
    - echo '{"deploy_time":"'$(date +'%Y-%m-%d %H:%M:%S %Z')'","commit_hash":"'$(git rev-parse --short HEAD)'","author":"'$(git log -1 --pretty=%an)'","message":"'$(git log -1 --pretty=%s | tr -d '"' | tr -d '\\')'"}' > $DEPLOYPATH/public/deploy_status.json
