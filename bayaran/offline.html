<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Bayaran</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .offline-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #f8d7da;
            color: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }
    </style>
</head>
<body>
    <div class="offline-card container">
        <div class="icon-circle">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h2 class="fw-bold mb-3">Tidak Ada Koneksi Internet</h2>
        <p class="text-muted mb-4">Halaman ini tidak dapat dimuat karena Anda sedang offline. Silakan periksa koneksi internet Anda dan coba lagi.</p>
        <button onclick="window.location.reload()" class="btn btn-primary px-4 py-2 rounded-pill">
            <i class="bi bi-arrow-clockwise me-2"></i>Coba Lagi
        </button>
    </div>
</body>
</html>
