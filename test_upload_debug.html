<!DOCTYPE html>
<html>
<head>
    <title>Test Upload Debug</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        img { max-width: 500px; margin: 10px 0; border: 2px solid #ddd; }
    </style>
</head>
<body>
    <h2>Test Upload & Display</h2>
    
    <h3>Step 1: Upload Image</h3>
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="image/*" required>
        <button type="submit">Upload</button>
    </form>
    
    <div id="uploadResult"></div>
    
    <h3>Step 2: Test Display</h3>
    <div id="displayTest"></div>
    
    <h3>Debug Info</h3>
    <div id="debugInfo"></div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Debug info
        const currentProtocol = window.location.protocol;
        const currentHost = window.location.host;
        const currentPath = window.location.pathname;
        
        $('#debugInfo').html(`
            <pre>
Current URL: ${window.location.href}
Protocol: ${currentProtocol}
Host: ${currentHost}
Path: ${currentPath}
Base URL (expected): ${currentProtocol}//${currentHost}/siakad/
            </pre>
        `);
        
        $('#uploadForm').on('submit', function(e) {
            e.preventDefault();
            
            const fileInput = $('#fileInput')[0];
            if (!fileInput.files || !fileInput.files[0]) {
                alert('Pilih file');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            // Get CSRF token from page (if exists)
            const csrfMeta = $('meta[name^="csrf"]');
            if (csrfMeta.length > 0) {
                const csrfName = csrfMeta.attr('name');
                const csrfHash = csrfMeta.attr('content');
                formData.append(csrfName, csrfHash);
            }
            
            $('#uploadResult').html('<div class="result">Uploading...</div>');
            
            $.ajax({
                url: '/siakad/index.php/admin/cbt/banksoal/uploadImage',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    console.log('Success:', response);
                    
                    let html = '<div class="result success">';
                    html += '<h4>✓ Upload Berhasil</h4>';
                    html += '<pre>' + JSON.stringify(response, null, 2) + '</pre>';
                    html += '</div>';
                    
                    $('#uploadResult').html(html);
                    
                    // Test display
                    if (response.url || response.location) {
                        const imageUrl = response.url || response.location;
                        testImageDisplay(imageUrl);
                    }
                },
                error: function(xhr) {
                    console.error('Error:', xhr);
                    
                    let html = '<div class="result error">';
                    html += '<h4>✗ Upload Gagal</h4>';
                    html += '<p>Status: ' + xhr.status + ' ' + xhr.statusText + '</p>';
                    
                    if (xhr.responseJSON) {
                        html += '<pre>' + JSON.stringify(xhr.responseJSON, null, 2) + '</pre>';
                    } else if (xhr.responseText) {
                        html += '<pre>' + xhr.responseText.substring(0, 500) + '</pre>';
                    }
                    
                    html += '</div>';
                    $('#uploadResult').html(html);
                }
            });
        });
        
        function testImageDisplay(imageUrl) {
            let html = '<div class="result">';
            html += '<h4>Testing Image Display</h4>';
            html += '<p><strong>URL:</strong> ' + imageUrl + '</p>';
            
            // Test 1: Direct img tag
            html += '<p><strong>Test 1: Direct &lt;img&gt; tag</strong></p>';
            html += '<img src="' + imageUrl + '" onload="imageLoaded(this)" onerror="imageFailed(this)">';
            
            // Test 2: AJAX HEAD request
            html += '<p id="test2"><strong>Test 2: AJAX HEAD request</strong> <span id="test2result">Testing...</span></p>';
            
            // Test 3: Different protocol
            const altUrl = imageUrl.replace(/^https?:/, currentProtocol);
            html += '<p><strong>Test 3: Current protocol (' + currentProtocol + ')</strong></p>';
            html += '<img src="' + altUrl + '" onload="imageLoaded(this)" onerror="imageFailed(this)">';
            
            html += '</div>';
            $('#displayTest').html(html);
            
            // AJAX test
            $.ajax({
                url: imageUrl,
                type: 'HEAD',
                success: function() {
                    $('#test2result').html('<span style="color: green">✓ Accessible</span>');
                },
                error: function(xhr) {
                    $('#test2result').html('<span style="color: red">✗ Not accessible (' + xhr.status + ')</span>');
                }
            });
        }
        
        window.imageLoaded = function(img) {
            $(img).after('<span style="color: green; margin-left: 10px;">✓ Loaded</span>');
        };
        
        window.imageFailed = function(img) {
            $(img).after('<span style="color: red; margin-left: 10px;">✗ Failed to load</span>');
            $(img).css('border-color', 'red');
        };
    </script>
</body>
</html>
