name: 🚀 Deploy ke cPanel

on:
  pull_request:
    types:
      - closed       # trigger saat PR di-close/merge
    branches:
      - main          # hanya PR yang target ke main

jobs:
  deploy:
    name: 🔄 Trigger cPanel Deploy via Webhook
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true  # hanya jalan jika PR benar-benar di-merge

    steps:
      # Trigger cPanel Git Webhook to pull and deploy
      - name: 🌐 Trigger Webhook
        env:
          WEBHOOK_URL: ${{ secrets.CPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ ERROR: CPANEL_DEPLOY_WEBHOOK secret is not set in GitHub repository settings!"
            echo "Please go to Settings -> Secrets and variables -> Actions and add CPANEL_DEPLOY_WEBHOOK."
            exit 1
          fi
          curl -s -S -X GET "$WEBHOOK_URL"
