name: 🚀 Deploy ke cPanel

on:
  pull_request:
    types:
      - closed       # trigger saat PR di-close/merge
    branches:
      - main          # hanya PR yang target ke main
  workflow_dispatch:   # izinkan trigger manual dari tab Actions GitHub

jobs:
  deploy:
    name: 🔄 Trigger cPanel Deploy via SSH
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: 🌐 Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || 'mabes11.sch.id' }}
          username: ${{ secrets.SSH_USERNAME || 'mabq7713' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 2223 }}
          script: |
            set -e
            cd /home/mabq7713/repo_ci4

            echo "=== [1/6] Pulling latest code ==="
            git checkout main
            git pull origin main

            echo "=== [2/6] Installing Composer dependencies ==="
            # Cari path PHP yang tersedia
            PHP_BIN=$(which php 2>/dev/null || which php82 2>/dev/null || ls /opt/cpanel/ea-php*/root/usr/bin/php 2>/dev/null | tail -1 || echo "php")
            echo "Using PHP: $PHP_BIN"

            # Download composer.phar jika belum ada
            if [ ! -f /home/mabq7713/composer.phar ]; then
              echo "Downloading composer.phar..."
              curl -sS https://getcomposer.org/installer | $PHP_BIN -- --install-dir=/home/mabq7713 --filename=composer.phar
            fi

            # Jalankan composer install
            $PHP_BIN /home/mabq7713/composer.phar install --no-dev --optimize-autoloader --no-interaction

            echo "=== [3/6] Deploying files to public_html ==="
            DEPLOYPATH=/home/mabq7713/public_html
            /bin/cp -Rf app $DEPLOYPATH/
            /bin/cp -Rf public/* $DEPLOYPATH/public/ 2>/dev/null || true
            /bin/cp -Rf system $DEPLOYPATH/
            /bin/cp -Rf vendor $DEPLOYPATH/
            /bin/cp -f index.php $DEPLOYPATH/
            /bin/cp -f spark $DEPLOYPATH/
            if [ -f .htaccess ]; then
              /bin/cp -f .htaccess $DEPLOYPATH/.htaccess
            fi
            echo '{"deploy_time":"'$(date +'%Y-%m-%d %H:%M:%S %Z')'","commit_hash":"'$(git rev-parse --short HEAD)'","author":"'$(git log -1 --pretty=%an)'","message":"'$(git log -1 --pretty=%s | tr -d '"' | tr -d '\\')'"}' > $DEPLOYPATH/public/deploy_status.json

            echo "=== [4/6] Running database migrations ==="
            $PHP_BIN /home/mabq7713/public_html/spark migrate

            echo "=== [5/6] Seeding default letter templates ==="
            $PHP_BIN /home/mabq7713/public_html/spark db:seed LetterTemplateSeeder || true

            echo "=== [6/6] Regenerating license and security hashes ==="
            $PHP_BIN /home/mabq7713/public_html/spark license:rehash

            # Flush CI4 file cache & reload PHP worker / OPcache
            rm -rf /home/mabq7713/public_html/writable/cache/* 2>/dev/null || true
            touch $DEPLOYPATH/index.php

            echo "=== Deployment Finished Successfully! ==="
