name: 🚀 Deploy ke cPanel

on:
  pull_request:
    types:
      - closed       # trigger saat PR di-close/merge
    branches:
      - main          # hanya PR yang target ke main
  workflow_dispatch:   # izinkan trigger manual dari tab Actions GitHub

jobs:
  deploy:
    name: 🔄 Trigger cPanel Deploy via SSH
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: 🌐 Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || 'mabes11.sch.id' }}
          username: ${{ secrets.SSH_USERNAME || 'mabq7713' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 2223 }}
          script: |
            set -e
            cd /home/mabq7713/repo_ci4

            echo "=== [1/4] Pulling latest code ==="
            git checkout main
            git pull origin main

            echo "=== [2/4] Installing Composer dependencies ==="
            # Cari path PHP yang tersedia
            PHP_BIN=$(which php 2>/dev/null || which php82 2>/dev/null || ls /opt/cpanel/ea-php*/root/usr/bin/php 2>/dev/null | tail -1 || echo "php")
            echo "Using PHP: $PHP_BIN"

            # Download composer.phar jika belum ada
            if [ ! -f /home/mabq7713/composer.phar ]; then
              echo "Downloading composer.phar..."
              curl -sS https://getcomposer.org/installer | $PHP_BIN -- --install-dir=/home/mabq7713 --filename=composer.phar
            fi

            # Jalankan composer install
            $PHP_BIN /home/mabq7713/composer.phar install --no-dev --optimize-autoloader --no-interaction

            echo "=== [3/6] Triggering cPanel deployment (copy to public_html) ==="
            uapi VersionControlDeployment create repository_root=/home/mabq7713/repo_ci4

            # Tunggu cPanel selesai menyalin file (max 60 detik)
            echo "Waiting for cPanel deployment to complete..."
            for i in $(seq 1 12); do
              if [ -f /home/mabq7713/public_html/spark ]; then
                echo "cPanel deployment complete (waited ${i}x5s)"
                break
              fi
              echo "  ...waiting ($i/12)"
              sleep 5
            done

            echo "=== [4/6] Running database migrations ==="
            cd /home/mabq7713/repo_ci4

            # Pastikan .env tersedia
            if [ ! -f .env ]; then
              echo "ERROR: File .env tidak ditemukan di repo_ci4! Migrate dibatalkan."
              exit 1
            fi
            echo "File .env ditemukan, menjalankan migrate..."

            # Debug: tampilkan info environment
            echo "--- PHP version: $($PHP_BIN -v | head -1)"
            echo "--- Spark path: $(pwd)/spark"
            echo "--- CI_ENVIRONMENT: $(grep CI_ENVIRONMENT .env | head -1)"

            # Nonaktifkan set -e sementara agar full error message tertampil
            set +e
            MIGRATE_OUTPUT=$($PHP_BIN spark migrate 2>&1)
            MIGRATE_EXIT=$?
            set -e

            echo "--- Migrate output: $MIGRATE_OUTPUT"
            echo "--- Migrate exit code: $MIGRATE_EXIT"

            if [ $MIGRATE_EXIT -ne 0 ]; then
              echo "ERROR: spark migrate gagal dengan exit code $MIGRATE_EXIT"
              exit $MIGRATE_EXIT
            fi

            echo "=== [5/6] Regenerating license and security hashes ==="
            set +e
            $PHP_BIN spark license:rehash 2>&1
            set -e

            echo "=== [6/6] Done! ==="
