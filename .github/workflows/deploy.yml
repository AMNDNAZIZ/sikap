name: 🚀 Deploy ke cPanel

on:
  pull_request:
    types:
      - closed       # trigger saat PR di-close/merge
    branches:
      - main          # hanya PR yang target ke main

jobs:
  deploy:
    name: 🔄 Trigger cPanel Deploy via SSH
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true  # hanya jalan jika PR benar-benar di-merge

    steps:
      - name: 🌐 Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || 'mabes11.sch.id' }}
          username: ${{ secrets.SSH_USERNAME || 'mabq7713' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 2223 }}
          script: |
            cd /home/mabq7713/repo_ci4
            git checkout main
            git pull origin main
            /usr/local/cpanel/bin/git-deploy
